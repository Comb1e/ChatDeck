<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>页面加载失败</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #faf9f5; color: #3d3929;
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    .card { text-align: center; max-width: 420px; padding: 32px; }
    h1 { font-family: Georgia, 'Times New Roman', SimSun, serif; font-size: 20px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 13px; color: #6b6659; line-height: 1.7; margin-bottom: 8px; }
    .code { font-family: Consolas, monospace; font-size: 12px; color: #b0aa9a; margin-bottom: 24px; }
    button {
      background: #d97757; color: #fff; border: none; border-radius: 8px;
      padding: 9px 24px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #c2603f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>页面没有加载出来</h1>
    <p id="desc">网络可能不可用，或站点暂时无法访问。</p>
    <p class="code" id="code"></p>
    <button id="retry">重试</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    document.getElementById('code').textContent =
      [params.get('code'), params.get('desc')].filter(Boolean).join(' · ')
    if (params.get('reason') === 'crashed') {
      document.getElementById('desc').textContent = '页面进程异常退出，点击重试重新加载。'
    }
    document.getElementById('retry').addEventListener('click', () => {
      window.deckError?.reload(params.get('p') || '')
    })
  </script>
</body>
</html>
